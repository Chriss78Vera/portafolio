<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 376" role="img" aria-labelledby="title desc">
  <title id="title">Logo Paktay</title>
  <desc id="desc">Emblema geométrico naranja, carbón y dorado sobre fondo transparente.</desc>
  <defs>
    <linearGradient id="charcoal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#66645f"/><stop offset=".45" stop-color="#2d2d2c"/><stop offset="1" stop-color="#575550"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0.85" y2="1"><stop stop-color="#ff9a28"/><stop offset=".5" stop-color="#ec6108"/><stop offset="1" stop-color="#bc3900"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd06a"/><stop offset=".45" stop-color="#a55009"/><stop offset=".75" stop-color="#f1a638"/><stop offset="1" stop-color="#743305"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1.5" dy="2" stdDeviation="1.5" flood-opacity=".35"/></filter>
    <clipPath id="coin-tl"><path d="M0 0h231L0 231z"/></clipPath>
    <clipPath id="coin-tr"><path d="M165 0h231v231z"/></clipPath>
    <clipPath id="coin-bl"><path d="M0 150v226h226z"/></clipPath>
    <clipPath id="coin-br"><path d="M396 150v226H170z"/></clipPath>
  </defs>
  <g stroke-linejoin="round" filter="url(#shadow)">
    <!-- orange outer hooks; no coins -->
    <g fill="url(#orange)" stroke="#b94203" stroke-width="3">
      <path d="M134 18h125l-3 7-35 31-25-18-25 18-35-31z"/>
      <path d="M137 356h122l-3-8-35-30-25 18-25-18-35 30z"/>
      <path d="M18 130l42 39-19 21 19 21-42 37z"/>
      <path d="M376 130l-42 39 19 21-19 21 42 37z"/>
    </g>
    <g fill="none" stroke="#ffb24a" stroke-width="3" opacity=".7">
      <path d="M142 25h108l-29 23-25-18-25 18z"/><path d="M145 348l26-22 25 18 25-18 26 22"/>
      <path d="M25 143l27 27-18 20 18 20-27 25"/><path d="M371 143l-27 27 18 20-18 20 27 25"/>
    </g>
    <!-- four simple half-coins, cut along the diagonal facing the centrepiece -->
    <g fill="url(#gold)" stroke="#843b08" stroke-width="4">
      <circle cx="120" cy="111" r="31" clip-path="url(#coin-tl)"/><circle cx="276" cy="111" r="31" clip-path="url(#coin-tr)"/>
      <circle cx="120" cy="270" r="31" clip-path="url(#coin-bl)"/><circle cx="276" cy="270" r="31" clip-path="url(#coin-br)"/>
    </g>
    <g fill="none" stroke="#ffe08c" stroke-width="2.5" opacity=".9">
      <circle cx="120" cy="111" r="25" clip-path="url(#coin-tl)"/><circle cx="276" cy="111" r="25" clip-path="url(#coin-tr)"/>
      <circle cx="120" cy="270" r="25" clip-path="url(#coin-bl)"/><circle cx="276" cy="270" r="25" clip-path="url(#coin-br)"/>
    </g>
    <g fill="none" stroke="#9a4809" stroke-width="3" stroke-linecap="round">
      <path clip-path="url(#coin-tl)" d="m107 111 13-10 13 10-13 10z"/>
      <path clip-path="url(#coin-tr)" d="m263 111 13-10 13 10-13 10z"/>
      <path clip-path="url(#coin-bl)" d="m107 270 13-10 13 10-13 10z"/>
      <path clip-path="url(#coin-br)" d="m263 270 13-10 13 10-13 10z"/>
    </g>
    <!-- central hollow diamond -->
    <path fill="url(#charcoal)" fill-rule="evenodd" stroke="#3b3b39" stroke-width="5" d="M196 51 338 189 196 325 57 190zM196 94l-96 96 96 91 97-92z"/>
    <path fill="none" stroke="#85827b" stroke-width="3" opacity=".55" d="M196 60 328 189 196 316 67 190z"/>
    <!-- inset orange diamond -->
    <path fill="url(#orange)" stroke="#bd4504" stroke-width="4" d="m196 137 52 52-52 52-52-52z"/>
    <path fill="none" stroke="#ffad43" stroke-width="3" opacity=".7" d="m196 145 43 44-43 43-43-43z"/>
  </g>
</svg>
